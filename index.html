<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F1ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101211" media="(prefers-color-scheme: dark)">
<title>Дом мечты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ГЛАВНАЯ -->
  <section id="s-home" class="screen active">
    <header class="hero">
      <h1>Дом мечты</h1>
      <p>Спроектируй дом снаружи и обставь комнаты внутри.</p>
    </header>
    <div id="house-list" class="house-list"></div>
    <div class="fab-wrap">
      <button id="btn-new" class="btn btn-primary btn-lg"></button>
    </div>
  </section>

  <!-- НАЗВАНИЕ -->
  <section id="s-name" class="screen">
    <div class="topbar">
      <button id="btn-name-back" class="iconbtn ghost" aria-label="Назад"></button>
      <div class="topbar-sub">Шаг 1 из 3</div>
    </div>
    <div class="center-panel">
      <h2>Как назовём проект?</h2>
      <p class="hint">Название увидишь в списке своих домов.</p>
      <input id="name-field" class="field" maxlength="28" placeholder="Дом на холме" autocomplete="off">
      <div class="chip-row" id="name-suggest"></div>
    </div>
    <div class="actionbar">
      <button id="btn-name-next" class="btn btn-primary btn-block"></button>
    </div>
  </section>

  <!-- ЭКСТЕРЬЕР -->
  <section id="s-ext" class="screen">
    <div class="topbar">
      <button id="btn-ext-back" class="iconbtn ghost" aria-label="Назад"></button>
      <div class="topbar-title" id="ext-title"></div>
      <button id="btn-time" class="iconbtn" aria-label="Время суток"></button>
    </div>
    <div class="stage exterior" id="ext-stage"></div>
    <div class="editor">
      <div class="segmented" id="ext-tabs" role="tablist"></div>
      <div class="panel" id="ext-panel"></div>
    </div>
    <div class="actionbar">
      <button id="btn-ext-next" class="btn btn-primary btn-block"></button>
    </div>
  </section>

  <!-- КОМНАТЫ -->
  <section id="s-rooms" class="screen">
    <div class="topbar">
      <button id="btn-rooms-back" class="iconbtn ghost" aria-label="Назад"></button>
      <div class="topbar-title">Комнаты</div>
      <div class="topbar-sub">Шаг 3 из 3</div>
    </div>
    <div class="room-grid" id="room-grid"></div>
    <div class="actionbar">
      <button id="btn-rooms-done" class="btn btn-primary btn-block"></button>
    </div>
  </section>

  <!-- РЕДАКТОР КОМНАТЫ -->
  <section id="s-room" class="screen">
    <div class="topbar">
      <button id="btn-room-back" class="iconbtn ghost" aria-label="Назад"></button>
      <div class="topbar-title" id="room-title"></div>
      <button id="btn-mood" class="iconbtn" aria-label="Освещение"></button>
    </div>
    <div class="stage room" id="room-stage">
      <div class="obj-toolbar" id="obj-toolbar" hidden></div>
    </div>
    <div class="editor">
      <div class="segmented" id="room-tabs" role="tablist"></div>
      <div class="panel" id="room-panel"></div>
    </div>
  </section>

  <!-- ИТОГ -->
  <section id="s-final" class="screen">
    <div class="topbar">
      <button id="btn-final-back" class="iconbtn ghost" aria-label="Назад"></button>
      <div class="topbar-title" id="final-title"></div>
    </div>
    <div class="summary" id="summary"></div>
    <div class="actionbar">
      <button id="btn-final-edit" class="btn btn-ghost"></button>
      <button id="btn-final-home" class="btn btn-primary"></button>
    </div>
  </section>

</div>

<div id="confirm" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="confirm-title"></h3>
    <p id="confirm-text"></p>
    <div class="actionbar">
      <button id="confirm-no" class="btn btn-ghost">Отмена</button>
      <button id="confirm-yes" class="btn btn-primary">Удалить</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="js/assets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
